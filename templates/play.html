<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Adventure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>Adventure</h1>
      </header>

      {% if error %}
      <p class="error-banner">{{ error }}</p>
      {% endif %}

      <div class="terminal">
        <div class="log" id="game-log" aria-live="polite" aria-relevant="additions">
          {% for entry in log %}
          <div class="line {{ entry.kind }}">{{ entry.text }}</div>
          {% endfor %}
        </div>
        <form class="input-row" method="post" action="{{ url_for('play') }}">
          {# JSON in value="" breaks on inner quotes; use textareas instead #}
          <textarea name="state" hidden>{{ state | tojson }}</textarea>
          <textarea name="log" hidden>{{ log | tojson }}</textarea>
          <input
            type="text"
            name="command"
            {% if ended %}disabled{% endif %}
            placeholder="{% if ended %}Game ended{% else %}Your answer…{% endif %}"
            autocomplete="off"
            spellcheck="false"
            aria-label="Game input"
          />
          <button type="submit" {% if ended %}disabled{% endif %}>Send</button>
        </form>
      </div>

      <div class="actions">
        <span class="version">Version: DEMO</span>
        <a class="button-link" href="{{ url_for('new_game') }}">New game</a>
      </div>
    </div>
    <script>
      (function () {
        var log = document.getElementById("game-log");
        if (!log) return;

        function scrollLogToBottom() {
          log.scrollTop = log.scrollHeight;
        }

        function focusInput() {
          var input = document.querySelector('.input-row input[name="command"]');
          if (input && !input.disabled) {
            input.focus({ preventScroll: true });
          }
        }

        function afterPaint() {
          scrollLogToBottom();
          focusInput();
        }

        afterPaint();
        requestAnimationFrame(afterPaint);
        window.addEventListener("load", afterPaint);
      })();
    </script>
  </body>
</html>
